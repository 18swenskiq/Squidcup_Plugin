---
openapi: "3.1.0"
info:
  title: "Squidcup Event Documentation"
  version: ""
  description: |
    This is the documentation of all JSON events and native plugin forwards for Squidcup. All HTTP events get
    sent as POST requests to the root of the URL you provided for
    [`squidcup_remote_log_url`](configuration#squidcup_remote_log_url) in your Squidcup configuration. You should inspect the value
    of the `event` property to determine the type of event. You cannot select which events to receive, but you can
    instead discard the ones you don't need.

    You are expected to return a 200-range HTTP code to all request, or Squidcup will consider them failed. The HTTP timeout
    is 15 seconds and there are no automatic retries.
    Note: This documentation is heavily inspired by Get5. Currently only those events are supported which are required for proper functioning of G5V/G5API. Though these events should be enough for now to get
    most of the match and player related data.
webhooks:
  "SquidcupOnSeriesInit":
    post:
      tags:
        - Series Flow
      summary: SquidcupOnSeriesInit
      description: |
        Fired when a series is started after loading a match config.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SquidcupSeriesStartedEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupMatchEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - series_start
                    num_maps:
                      type: integer
                      minimum: 1
                      description: The number of maps in the series, i.e. 3 for a Bo3.
                    team1:
                      "$ref": "#/components/schemas/SquidcupTeamWrapper"
                    team2:
                      "$ref": "#/components/schemas/SquidcupTeamWrapper"
  "SquidcupOnMapResult":
    post:
      tags:
        - Series Flow
      summary: SquidcupOnMapResult
      description: |
        Fired when the map ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: MapResultEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupMapEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - map_result
                    team1:
                      $ref: "#/components/schemas/SquidcupStatsTeam"
                    team2:
                      $ref: "#/components/schemas/SquidcupStatsTeam"
                    winner:
                      $ref: "#/components/schemas/Winner"
  "SquidcupOnSeriesResult":
    post:
      tags:
        - Series Flow
      summary: SquidcupOnSeriesResult
      description: |
        Fired when a series ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SquidcupSeriesResultEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupMatchEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - series_end
                    team1_series_score:
                      type: integer
                      minimum: 0
                      example: 2
                      description: The map/series score of team1.
                    team2_series_score:
                      type: integer
                      minimum: 0
                      description: The map/series score of team2.
                    winner:
                      $ref: "#/components/schemas/Winner"
                    time_until_restore:
                      type: integer
                      minimum: 0
                      example: 45
                      description: |
                        The number of seconds until Squidcup restores any changed ConVars and resets its game state to
                        `none` after the series has ended.
  "SquidcupOnSidePicked":
    post:
      tags:
        - Series Flow
      summary: SquidcupOnSidePicked
      description: |
        Fired when a side is picked by a team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SquidcupSidePickedEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupMapSelectionEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - side_picked
                    side:
                      $ref: "#/components/schemas/Side"
                    map_number:
                      type: integer
                      minimum: 0
                      description: The map number the team chose a side for.
  "SquidcupOnMapPicked":
    post:
      tags:
        - Series Flow
      summary: SquidcupOnMapPicked
      description: |
        Fired when a team picks a map.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SquidcupMapPickedEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupMapSelectionEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - map_picked
                    map_number:
                      type: integer
                      minimum: 0
                      description: The map number of the chosen map.
  "SquidcupOnMapVetoed":
    post:
      tags:
        - Series Flow
      summary: SquidcupOnMapVetoed
      description: |
        Fired when a team vetos a map.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SquidcupMapPickedEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupMapSelectionEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - map_vetoed

  "SquidcupOnGoingLive":
    post:
      tags:
        - Map Flow
      summary: SquidcupOnGoingLive
      description: |
        Fired when a map is going live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: GoingLiveEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupMapEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - going_live
  "SquidcupOnRoundEnd":
    post:
      tags:
        - Live
      summary: SquidcupOnRoundEnd
      description: |
        Fired when a round ends - when the result is in; not when the round stops. Game activity can occur after this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SquidcupRoundEndedEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupTimedRoundEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - round_end
                    reason:
                      type: integer
                      minimum: 0
                      description: The reason for the round ending. See https://github.com/roflmuffin/CounterStrikeSharp/blob/main/managed/CounterStrikeSharp.API/Modules/Entities/Constants/RoundEndReason.cs#L19.
                    winner:
                      $ref: "#/components/schemas/Winner"
                    team1:
                      title: SquidcupStatsTeam
                      description: The stats for team 1.
                      allOf:
                        - $ref: "#/components/schemas/SquidcupStatsTeam"
                    team2:
                      title: SquidcupStatsTeam
                      description: The stats for team 2.
                      allOf:
                        - $ref: "#/components/schemas/SquidcupStatsTeam"
  "SquidcupOnDemoUploadEnded":
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: SquidcupDemoUploadEndedEvent
              allOf:
                - "$ref": "#/components/schemas/SquidcupDemoFileEvent"
                - type: object
                  properties:
                    event:
                      enum:
                        - demo_upload_ended
                    success:
                      type: boolean
                      description: Whether the upload was successful.

components:
  schemas:
    SquidcupEvent:
      type: object
      properties:
        event:
          type: string
          description: The name of the event.
    SquidcupMatchEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupEvent"
        - type: object
          properties:
            matchid:
              type: integer
              description: The ID of the match.
              example: 14272
    SquidcupMatchTeamEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupMatchEvent"
        - type: object
          properties:
            team:
              $ref: "#/components/schemas/Team"
    SquidcupMapEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupMatchEvent"
        - type: object
          properties:
            map_number:
              type: integer
              minimum: 0
              example: 0
              description: The map number in the series, starting at 0.
    SquidcupMapSelectionEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupMatchTeamEvent"
        - type: object
          properties:
            map_name:
              type: string
              example: de_nuke
              description:
                The name of the map related to the event (map picked/banned
                etc.).
    SquidcupMapTeamEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupMapEvent"
        - type: object
          properties:
            team:
              $ref: "#/components/schemas/Team"
    SquidcupRoundEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupMapEvent"
        - type: object
          properties:
            round_number:
              type: integer
              minimum: 0
              example: 13
              description: The round number of the map, starting at 0.
    SquidcupTimedRoundEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupRoundEvent"
        - type: object
          properties:
            round_time:
              type: integer
              description: The number of milliseconds into the round the event occurred.
              minimum: 0
              example: 51434
    Winner:
      type: object
      description: Describes a winning team (their side and team number).
      properties:
        side:
          $ref: "#/components/schemas/Side"
        team:
          $ref: "#/components/schemas/Team"
    Team:
      type: string
      nullable: true
      description: Represents a team. `null` if no team. Represented as an integer enum.
      enum:
        - team1
        - team2
        - spec
    Side:
      type: string
      nullable: true
      description: Represents a side (CT vs T). `null` if no side. Represented as an integer enum.
      enum:
        - ct
        - t
        - spec
    SquidcupTeamWrapper:
      type: object
      description: Describes a team (`Team1` or `Team2`).
      properties:
        id:
          type: string
          description: User-supplied ID of the team, if one was provided.
          example: "2843"
          nullable: true
        name:
          type: string
          description: The name of the team.
          example: Natus Vincere
    SquidcupStatsTeam:
      description: Describes a team with its score and player stats.
      allOf:
        - $ref: "#/components/schemas/SquidcupTeamWrapper"
        - type: object
          properties:
            series_score:
              type: integer
              minimum: 0
              description: The team's current series score, i.e. the number of maps they have won in the series.
            score:
              type: integer
              minimum: 0
              description: The team's total score on the current map.
              example: 14
            score_ct:
              type: integer
              minimum: 0
              description: The team's score on the CT side on the current map.
              example: 10
            score_t:
              type: integer
              minimum: 0
              description: The team's score on the T side on the current map.
              example: 14
            players:
              type: array
              description: The players on the team.
              items:
                $ref: "#/components/schemas/StatsPlayer"
            side:
              title: Side
              description: The current side of the team.
              allOf:
                - $ref: "#/components/schemas/Side"
            starting_side:
              title: Side
              description: The starting side of the team.
              allOf:
                - $ref: "#/components/schemas/Side"
    StatsPlayer:
      allOf:
        - type: object
          properties:
            steamid:
              type: string
              example: "76561198279375306"
              description: |
                The SteamID64 of the player.
            name:
              type: string
              description: |
                The in-game name of the player.
              example: s1mple
            stats:
              $ref: "#/components/schemas/PlayerStats"
    PlayerStats:
      type: object
      description: The stats of the player.
      properties:
        kills:
          type: integer
          minimum: 0
          description: "The number of kills the player had."
          example: 34
        deaths:
          type: integer
          minimum: 0
          description: "The number of deaths the player had."
          example: 8
        assists:
          type: integer
          minimum: 0
          description: "The number of assists the player had."
          example: 5
        flash_assists:
          type: integer
          minimum: 0
          description: "The number of flashbang assists the player had."
          example: 3
        team_kills:
          type: integer
          minimum: 0
          description: "The number of team-kills the player had."
          example: 0
        suicides:
          type: integer
          minimum: 0
          description: "The number of suicides the player had."
          example: 0
        damage:
          type: integer
          minimum: 0
          description: "The total amount of damage the player dealt."
          example: 2948
        utility_damage:
          type: integer
          minimum: 0
          description: "The total amount of damage the player dealt via utility."
          example: 173
        enemies_flashed:
          type: integer
          minimum: 0
          description: "The number of enemies flashed by the player."
          example: 6
        friendlies_flashed:
          type: integer
          minimum: 0
          description: "The number of teammates flashed by the player."
          example: 2
        knife_kills:
          type: integer
          minimum: 0
          description: "The number kills the player had with a knife."
          example: 1
        headshot_kills:
          type: integer
          minimum: 0
          description: "The number kills the player had that were headshots."
          example: 19
        rounds_played:
          type: integer
          minimum: 0
          description: "The number of rounds the player started."
          example: 27
        bomb_defuses:
          type: integer
          minimum: 0
          description: "The number of times the player defused the bomb."
          example: 4
        bomb_plants:
          type: integer
          minimum: 0
          description: "The number of times the player planted the bomb."
          example: 3
        1k:
          type: integer
          minimum: 0
          description: "The number of rounds where the player killed 1 opponent."
          example: 3
        2k:
          type: integer
          minimum: 0
          description: "The number of rounds where the player killed 2 opponents."
          example: 2
        3k:
          type: integer
          minimum: 0
          description: "The number of rounds where the player killed 3 opponents."
          example: 3
        4k:
          type: integer
          minimum: 0
          description: "The number of rounds where the player killed 4 opponents."
          example: 0
        5k:
          type: integer
          minimum: 0
          description: "The number of rounds where the player killed 5 opponents."
          example: 1
        1v1:
          type: integer
          minimum: 0
          description: "The number of 1v1s the player won."
          example: 1
        1v2:
          type: integer
          minimum: 0
          description: "The number of 1v2s the player won."
          example: 3
        1v3:
          type: integer
          minimum: 0
          description: "The number of 1v3s the player won."
          example: 2
        1v4:
          type: integer
          minimum: 0
          description: "The number of 1v4s the player won."
          example: 0
        1v5:
          type: integer
          minimum: 0
          description: "The number of 1v5s the player won."
          example: 1
        first_kills_t:
          type: integer
          minimum: 0
          description: "The number of rounds where the player had the first kill in the round while playing the T side."
          example: 6
        first_kills_ct:
          type: integer
          minimum: 0
          description: "The number of rounds where the player had the first kill in the round while playing the CT side."
          example: 5
        first_deaths_t:
          type: integer
          minimum: 0
          description: "The number of rounds where the player was the first to die in the round while playing the T side."
          example: 1
        first_deaths_ct:
          type: integer
          minimum: 0
          description: "The number of rounds where the player was the first to die in the round while playing the CT side."
          example: 1
        trade_kills:
          type: integer
          minimum: 0
          description: "The number of times the player got a kill in a trade."
          example: 3
        kast:
          type: integer
          minimum: 0
          description: "The number of rounds where the player (k)illed a player, had an (a)ssist, (s)urvived or was (t)raded."
          example: 23
        score:
          type: integer
          minimum: 0
          description: 'The in-game "score" of the player.'
          example: 45
        mvp:
          type: integer
          minimum: 0
          description: "The number of times the player was elected the round MVP."
          example: 4
    SquidcupDemoFileEvent:
      allOf:
        - "$ref": "#/components/schemas/SquidcupMapEvent"
        - type: object
          properties:
            filename:
              type: string
              example: "1324_map_0_de_nuke.dem"
              description: |
                The name of the file containing the CSTV recording of the map. The format is determined by the
                `squidcup_demo_name_format` parameter.
tags:
  - name: All Events
    description: Forward fired for all events.
  - name: Series Flow
    description: Events that occur in relation to setting up a match or series.
  - name: Map Flow
    description: Events that occur in relation to a map pick or match-events on a map.
  - name: Live
    description: Events that only occur during live rounds (not during knife, veto or warmup).
  # - name: Client Actions
  #   description: Events that occur based on players' chat or connection activity.
